components:
  schemas:
    PublishSubscribeEditModel:
      type: object
      properties:
        PublishToUrl:
          type: string
        PublishType:
          format: int32
          enum:
          - 0
          type: integer
        VehicleId:
          format: int32
          type: integer
        AuthenticationType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          type: integer
        AuthenticationData:
          type: string
      additionalProperties: false
    PublishSubscribeModel:
      type: object
      properties:
        PublishSubscribeId:
          format: int32
          type: integer
        PublishToUrl:
          type: string
        PublishType:
          format: int32
          enum:
          - 0
          type: integer
        VehicleId:
          format: int32
          type: integer
        AuthenticationType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          type: integer
        AuthenticationData:
          type: string
      additionalProperties: false
    PublishSubscribeCreateModel:
      type: object
      properties:
