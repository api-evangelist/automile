openapi: 3.2.0
info:
  title: Automile Login API
  version: v1
tags:
- name: Login
paths:
  /login:
    get:
      tags:
      - Login
      parameters:
      - in: query
        name: client_id
        schema:
          type: string
      - in: query
        name: scope
        schema:
          type: string
      - in: query
        name: redirect_uri
        schema:
          type: string
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: response_type
        schema:
          type: string
          default: token
      responses:
        '200':
          description: Success
      summary: Get login
      x-summary-source: derived
      operationId: getLogin
      x-operation-id-source: derived
    post:
      tags:
      - Login
      parameters:
      - in: query
        name: UserName
        required: true
        schema:
          type: string
      - in: query
        name: Password
        required: true
        schema:
          type: string
      - in: query
        name: ClientId
        schema:
          type: string
      - in: query
        name: Scopes
        schema:
          type: string
      - in: query
        name: RedirectUri
        schema:
          type: string
      - in: query
        name: State
        schema:
          type: string
      - in: query
        name: ResponseType
        schema:
          type: string
      responses:
        '200':
          description: Success
      summary: Create login
      x-summary-source: derived
      operationId: postLogin
      x-operation-id-source: derived
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        implicit:
          scopes:
            read: Read access to protected resources
            write: Write access to protected resources
          authorizationUrl: https://api.automile.com/login/
      description: OAuth2 Implicit Grant
