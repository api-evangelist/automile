openapi: 3.2.0
info:
  title: Automile Resource Owner Trip3 V2 API
  version: v1
tags:
- name: ResourceOwnerTrip3V2
paths:
  /v1/resourceowner/trips3:
    get:
      tags:
      - ResourceOwnerTrip3V2
      summary: Get all trips that the user has access to
      description: Only returns trips that the user have access to
      operationId: GetResourceOwnerTrips2
      parameters:
      - in: query
        name: lastNumberOfDays
        description: Optional enter last number of days to get trips for
        schema:
          type: integer
          format: int32
      - in: query
        name: vehicleId
        description: Optional vehicle id to get trips for
        schema:
          type: integer
          format: int32
      - in: query
        name: synchronized
        description: Optional include synchronized trips (defaults to true)
        schema:
          type: boolean
          default: true
      - in: query
        name: fromUtc
        description: Retrieve trips from this date. (Can't be used if lastNumberOfDays is specified)
        schema:
          type: string
          format: date-time
      - in: query
        name: toUtc
        description: Retrieve trips to this date. (Can't be used if lastNumberOfDays is specified)
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip2Model'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip2Model'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip2Model'
      security:
      - oauth2: []
  /v1/resourceowner/trips3/{tripId}:
    get:
      tags:
      - ResourceOwnerTrip3V2
      summary: Get the details about the trip
      description: Only trips that are associated with the vehicles that user has relationships with are allowed.
      operationId: GetResourceOwnerTripDetail2
      parameters:
      - in: path
        name: tripId
        description: The trip id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The trip details are returned
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Trip2DetailModel'
            application/json:
              schema:
                $ref: '#/components/schemas/Trip2DetailModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Trip2DetailModel'
        '403':
          description: Request is forbidden, meaning you don't have access to this trip
        '500':
          description: Internal server error
      security:
      - oauth2: []
    put:
      tags:
      - ResourceOwnerTrip3V2
      summary: Updates the given trip with a trip type (category) and trip tags
      description: This operation would only update the trip type and trip tags if authorized for this trip.
      operationId: EditResourceOwnerTrip2
      parameters:
      - in: path
        name: tripId
        description: The trip id to update
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The trip was saved
        '500':
          description: Internal server error
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Trip2EditModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Trip2EditModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Trip2EditModel'
        description: The triptype and triptags to update
  /v1/resourceowner/trips3/{tripId}/geostartend:
    get:
      tags:
      - ResourceOwnerTrip3V2
      summary: Get the trip start and stop geo locations
      description: Only trips that are associated with the vehicles that user has relationships with are allowed.
      operationId: GetResourceOwnerGeoStartStop2
      parameters:
      - in: path
        name: tripId
        description: The trip id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The Start and stop geo locations details are returned
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Trip2StartEndGeoModel'
            application/json:
              schema:
                $ref: '#/components/schemas/Trip2StartEndGeoModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Trip2StartEndGeoModel'
        '403':
          description: Request is forbidden, meaning you don't have access to this trip
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/trips3/{tripId}/speed:
    get:
      tags:
      - ResourceOwnerTrip3V2
      summary: Get the vehicle speed if it's reported by the vehicle
      description: This is a quick method, instead of retrieving raw data with the pid operation. Is reported in km/h.
      operationId: GetResourceOwnerTripSpeed2
      parameters:
      - in: path
        name: tripId
        description: The trip id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The vehicle speeds are returned
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleSpeed2Model'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleSpeed2Model'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleSpeed2Model'
        '501':
          description: Not implemented, meaning the PID is not supported or is not recorded by the vehicle
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/trips3/{tripId}/rpm:
    get:
      tags:
      - ResourceOwnerTrip3V2
      summary: Get the vehicle engine rpm if it's reported by the vehicle
      description: This is a quick method, instead of retrieving raw data with the pid operation.
      operationId: GetResourceOwnerTripRPM2
      parameters:
      - in: path
        name: tripId
        description: The trip id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The vehicle engine rpm are returned
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RPM2Model'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RPM2Model'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RPM2Model'
        '501':
          description: Not implemented, meaning the PID is not supported or is not recorded by the vehicle
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/trips3/{tripId}/ambienttemperature:
    get:
      tags:
      - ResourceOwnerTrip3V2
      summary: Get the vehicle ambient (outside) temperature if it's reported by the vehiclee
      description: This is a quick method, instead of retrieving raw data with the pid operation. The result is in celsius.
      operationId: GetResourceOwnerTripAmbientTemperature2
      parameters:
      - in: path
        name: tripId
        description: The trip id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Te list of all ambient temperatures are returned
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AmbientAirTemperatureModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AmbientAirTemperatureModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AmbientAirTemperatureModel'
        '501':
          description: Not implemented, meaning the PID is not supported or is not recorded by the vehicle
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/trips3/{tripId}/fuellevelinput:
    get:
      tags:
      - ResourceOwnerTrip3V2
      summary: Get the vehicle current fuel level if it's reported by the vehicle
      description: This is a quick method, instead of retrieving raw data with the pid operation. The result is in percentage of total 100
      operationId: GetResourceOwnerTripFuelLevelInput2
      parameters:
      - in: path
        name: tripId
        description: The trip id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The recorded fuel level details are returned
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuelLevelInput2Model'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuelLevelInput2Model'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FuelLevelInput2Model'
        '501':
          description: Not implemented, meaning the PID is not supported or is not recorded by the vehicle
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/trips3/{tripId}/enginecoolanttemperature:
    get:
      tags:
      - ResourceOwnerTrip3V2
      summary: Get the engine coolant temperature if it's reported by the vehicle
      description: This is a quick method, instead of retrieving raw data with the pid operation
      operationId: GetResourceOwnerTripEngineCoolantTemperature2
      parameters:
      - in: path
        name: tripId
        description: The trip id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The engine coolant temperature are returned
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EngineCoolantTemperature2Model'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EngineCoolantTemperature2Model'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EngineCoolantTemperature2Model'
        '501':
          description: Not implemented, meaning the PID is not supported or is not recorded by the vehicle
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/trips3/{tripId}/pid/{pidId}:
    get:
      tags:
      - ResourceOwnerTrip3V2
      summary: This will get the raw PID data if the vehicle has reported that it is being…
      description: The data array will contain a sub-array of integers representing the raw data
      operationId: GetResourceOwnerTripPid2
      parameters:
      - in: path
        name: tripId
        description: The trip id
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: pidId
        description: The PID id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ThePID data are returned
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PID2Model'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PID2Model'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PID2Model'
        '501':
          description: Not implemented, meaning the PID is not supported or is not recorded by the vehicle
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/trips3/{tripId}/geo:
    get:
      tags:
      - ResourceOwnerTrip3V2
      summary: Get the gps locations for the vehicle, includes position and heading
      description: This operation would require compression enabled by the client.
      operationId: GetResourceOwnerTripGeo2
      parameters:
      - in: path
        name: tripId
        description: The trip id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: everyNthRecord
        description: Optional if you wish to limit to n:th number of records
        schema:
          type: integer
          format: int32
          default: 1
      - in: query
        name: snapToRoad
        description: ''
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: The Geo data are returned
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip2GeoModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip2GeoModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip2GeoModel'
        '501':
          description: Not implemented, meaning the PID is not supported or is not recorded by the vehicle
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/trips3/{tripId}/googleurltostaticmapencodedpolyline:
    get:
      tags:
      - ResourceOwnerTrip3V2
      summary: Gets Google static map URL with the trip route as a polyline
      operationId: GetGoogleurlToStaticMapEncodedPolyline2
      parameters:
      - in: path
        name: tripId
        description: The trip id
        required: true
        schema:
          type: integer
          format: int32
      - in: query
        name: height
        description: Height of the map
        schema:
          type: integer
          format: int32
      - in: query
        name: width
        description: Width of the map
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The Google Map Url are returned
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '400':
          description: Bad request, this operation explicitly require gzip compression by the client
        '501':
          description: Not implemented, meaning the PID is not supported or is not recorded by the vehicle
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/trips3/setdriverontrip:
    put:
      tags:
      - ResourceOwnerTrip3V2
      summary: Updates the given trip with given contactid
      description: This operation would only update the driver if authorized for this trip.
      operationId: SetDriverOnTrip2
      parameters:
      - in: query
        name: tripId
        description: The trip to update
        schema:
          type: integer
          format: int32
      - in: query
        name: contactId
        description: The contact id for the driver
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The trip was saved
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/trips3/{tripId}/details:
    get:
      tags:
      - ResourceOwnerTrip3V2
      summary: Get the details about the trip including driving events, speeding and idling
      description: Only trips that are associated with the vehicles that user has relationships with are allowed.
      operationId: GetResourceOwnerTripDetailConcat2
      parameters:
      - in: path
        name: tripId
        description: The trip id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The trip details are returned
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TripConcatenationModel'
            application/json:
              schema:
                $ref: '#/components/schemas/TripConcatenationModel'
            text/json:
              schema:
                $ref: '#/components/schemas/TripConcatenationModel'
        '403':
          description: Request is forbidden, meaning you don't have access to this trip
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/trips3/{tripId}/advanced:
    get:
      tags:
      - ResourceOwnerTrip3V2
      summary: Get the advanced details about the trip including driving events, speeding…
      description: Only trips that are associated with the vehicles that user has relationships with are allowed.
      operationId: GetResourceOwnerTripAdvanced2
      parameters:
      - in: path
        name: tripId
        description: The trip id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The trip advanced data are returned
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/TripConcatenationModel'
            application/json:
              schema:
                $ref: '#/components/schemas/TripConcatenationModel'
            text/json:
              schema:
                $ref: '#/components/schemas/TripConcatenationModel'
        '403':
          description: Request is forbidden, meaning you don't have access to this trip
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/trips3/batch/triptype:
    put:
      tags:
      - ResourceOwnerTrip3V2
      summary: Updates a list of trip id's with the provided trip type
      description: This operation only updates the trip types if authorized to all trips in list.
      operationId: ResourceOwnerTrip3Controller_TripTypeBatchUpdate
      responses:
        '200':
          description: The trips was saved
        '500':
          description: Internal server error
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripTypeBatchUpdateModel'
          text/json:
            schema:
              $ref: '#/components/schemas/TripTypeBatchUpdateModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/TripTypeBatchUpdateModel'
        description: The trip type and trips to update
components:
  schemas:
    EngineCoolantTemperature2Model:
      type: object
      properties:
        TemperatureInCelsius:
          format: double
          type: number
        RecordTimeStamp:
          format: date-time
          type: string
      additionalProperties: false
    PID2Model:
      type: object
      properties:
        Data:
          format: byte
          type: string
        RecordTimeStamp:
          format: date-time
          type: string
        Value:
          format: double
          type: number
      additionalProperties: false
    TripConcatenationData:
      type: object
      properties:
        RecordTimeStamp:
          format: date-time
          type: string
        RecordTimeStampEpochMs:
          format: int64
          type: integer
          readOnly: true
        Value:
          format: double
          type: number
      additionalProperties: false
    Trip2EditModel:
      type: object
      properties:
        CustomCategory:
          type: string
        TripType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          type: integer
        TripTags:
          type: array
          items:
            type: string
        LastEditedByContactId:
          format: int32
          type: integer
        BusinessContact:
          type: string
        BusinessContactCompany:
          type: string
        TripReason:
          type: string
      additionalProperties: false
    TripConcatenationSpeedPoint:
      type: object
      properties:
        Speed:
          format: double
          type: number
        SpeedLimit:
          format: double
          type: number
        Latitude:
          format: double
          type: number
        Longitude:
          format: double
          type: number
        RecordTimeStamp:
          format: date-time
          type: string
        RecordTimeStampEpochMs:
          format: int64
          type: integer
          readOnly: true
      additionalProperties: false
    Trip2StartEndGeoModel:
      type: object
      properties:
        StartLatitude:
          format: double
          type: number
        StartLongitude:
          format: double
          type: number
        EndLatitude:
          format: double
          type: number
        EndLongitude:
          format: double
          type: number
      additionalProperties: false
    TripConcatenationModel:
      type: object
      properties:
        TripId:
          format: int32
          type: integer
        VehicleId:
          format: int32
          type: integer
        VehicleName:
          type: string
        MergedFromTripIds:
          type: array
          items:
            format: int32
            type: integer
        SpeedGroups:
          type: array
          items:
            $ref: '#/components/schemas/TripConcatenationSpeedGroup'
        SpeedPoints:
          type: array
          items:
            $ref: '#/components/schemas/TripConcatenationSpeedPoint'
        RawPoints:
          type: array
          items:
            $ref: '#/components/schemas/TripConcatenationPoint'
        SnappedToRoadPoints:
          type: array
          items:
            $ref: '#/components/schemas/TripConcatenationSimplePoint'
        IdlingEvents:
          type: array
          items:
            $ref: '#/components/schemas/TripConcatenationIdling'
        DrivingEvents:
          type: array
          items:
            $ref: '#/components/schemas/TripConcatenationEvent'
        SpeedData:
          type: array
          items:
            $ref: '#/components/schemas/TripConcatenationData'
        SpeedLimitData:
          type: array
          items:
            $ref: '#/components/schemas/TripConcatenationData'
        RPMData:
          type: array
          items:
            $ref: '#/components/schemas/TripConcatenationData'
        FuelRateData:
          type: array
          items:
            $ref: '#/components/schemas/TripConcatenationData'
        StartDateTime:
          format: date-time
          type: string
        EndDateTime:
          format: date-time
          type: string
        TripTimeZone:
          format: int32
          type: integer
        StartFormattedAddress:
          type: string
        EndFormattedAddress:
          type: string
        StartCustomAddress:
          type: string
        EndCustomAddress:
          type: string
        Distance:
          format: double
          type: number
        FuelConsumption:
          format: double
          type: number
        LengthInMinutes:
          format: int32
          type: integer
        DriverContactId:
          format: int32
          type: integer
        DriverName:
          type: string
        IdleRPMAverage:
          format: int32
          type: integer
        IdleTimeInSecondsForAllTrip:
          format: int32
          type: integer
        IdleTimeInSecondsFromStart:
          format: int32
          type: integer
        CO2Emission:
          format: double
          type: number
        MaxSpeed:
          format: double
          type: number
        MaxRPM:
          format: int32
          type: integer
        ParkedForMinutesUntilNextTrip:
          format: int32
          type: integer
        StartPoint:
          $ref: '#/components/schemas/TripConcatenationStartEndPoint'
        EndPoint:
          $ref: '#/components/schemas/TripConcatenationStartEndPoint'
        Notes:
          type: string
        TripType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        AverageSpeedInKilometersPerHour:
          format: double
          type: number
        CustomCategory:
          type: string
        HideStartRoute:
          type: boolean
        HideEndRoute:
          type: boolean
        IsImperial:
          type: boolean
        UnitType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        TripApprovalStatus:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          type: integer
        RegisteredTollList:
          type: array
          items:
            $ref: '#/components/schemas/RegisteredTollModelGET'
        HasGermanTaxRules:
          type: boolean
          readOnly: true
        BusinessContact:
          type: string
          readOnly: true
        BusinessContactCompany:
          type: string
          readOnly: true
        TripReason:
          type: string
          readOnly: true
        IsLocked:
          type: boolean
          readOnly: true
        LockReason:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 4
          type: integer
          readOnly: true
      additionalProperties: false
    VehicleSpeed2Model:
      type: object
      properties:
        SpeedKmPerHour:
          format: double
          type: number
        RecordTimeStamp:
          format: date-time
          type: string
      additionalProperties: false
    TripConcatenationPoint:
      type: object
      properties:
        Latitude:
          format: double
          type: number
        Longitude:
          format: double
          type: number
        RecordTimeStamp:
          format: date-time
          type: string
        RecordTimeStampEpochMs:
          format: int64
          type: integer
          readOnly: true
        Speed:
          format: double
          type: number
        RPM:
          format: double
          type: number
        HeadingDegress:
          format: int32
          type: integer
        Hdop:
          format: int32
          type: integer
        NumberOfSatellites:
          format: int32
          type: integer
      additionalProperties: false
    Trip2DetailModel:
      type: object
      properties:
        TripId:
          format: int32
          type: integer
        IMEI:
          type: string
        TripStartDateTime:
          format: date-time
          type: string
        TripStartTimeZone:
          format: int32
          type: integer
        TripStartODOMeter:
          format: int32
          type: integer
        TripNumber:
          format: int32
          type: integer
        NumberOfSupportedPIDs:
          format: int32
          type: integer
        VehicleIdentificationNumber:
          type: string
        VechicleProtocol:
          type: string
        TripEndDateTime:
          format: date-time
          type: string
        TripEndTimeZone:
          format: int32
          type: integer
        TripEndODOMeter:
          format: int32
          type: integer
