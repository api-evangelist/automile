openapi: 3.2.0
info:
  title: Automile Resource Owner Quote API
  version: v1
tags:
- name: ResourceOwnerQuote
paths:
  /v1/resourceowner/quotes:
    get:
      tags:
      - ResourceOwnerQuote
      summary: Retrieve a list of quotes and their containing attachments, items and notes
      description: If no time is set on the "to" parameter, then it's assumed all entries on the date should be included, and the time part will be set to 11:59:59 PM
      operationId: ResourceOwnerQuote_ListQuotes
      parameters:
      - in: query
        name: from
        description: Filter on Created to be on or after from date (default is 30 days prior to todays date)
        schema:
          type: string
          format: date-time
      - in: query
        name: to
        description: Filter on Created to be on or after to date (default is todays date)
        schema:
          type: string
          format: date-time
      - in: query
        name: quoteStatus
        description: Status on quote (Incomplete = 0, Created = 1, SentToCustomerForApproval = 2, Approved = 3, ConvertedToWorkOrder = 4, Declined = 5) (default is all)
        schema:
          type: integer
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
      - in: query
        name: includeDeleted
        description: Include deleted quote (default is false)
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Successful request
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteModelGET'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteModelGET'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteModelGET'
        '500':
          description: Internal server error
      security:
      - oauth2: []
    post:
      tags:
      - ResourceOwnerQuote
      summary: Create a new Quote
      operationId: ResourceOwnerQuote_CreateQuote
      responses:
        '200':
          description: A link in the header is returned to the newly created quote.
        '500':
          description: Internal server error.
        '400':
          description: Bad request, could occur for various cases, see returned message.
        '403':
          description: Request is forbidden, could occur for various reasons, see returned message.
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteModelPOST'
          text/json:
            schema:
              $ref: '#/components/schemas/QuoteModelPOST'
          application/*+json:
            schema:
              $ref: '#/components/schemas/QuoteModelPOST'
        description: Quote model
    put:
      tags:
      - ResourceOwnerQuote
      summary: Update or create one or many quotes
      description: 'For quotes, items, attachments and notes with an id is updated. When id is not provided new objects is created. If an

        item, attachment or note is missing on an existing quote that item, attachment or note is removed.'
      operationId: ResourceOwnerWorkOrder_SaveQuoteList
      responses:
        '200':
          description: Successful update
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteModelGET'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteModelGET'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuoteModelGET'
        '500':
          description: Internal server error.
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/QuoteModelSyncPUT'
          text/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/QuoteModelSyncPUT'
          application/*+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/QuoteModelSyncPUT'
        description: List of quotes
  /v1/resourceowner/quotes/{quoteId}:
    get:
      tags:
      - ResourceOwnerQuote
      summary: Get a Quote
      operationId: ResourceOwnerQuote_GetQuote
      parameters:
      - in: path
        name: quoteId
        description: Quote Id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/QuoteModelGET'
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteModelGET'
            text/json:
              schema:
                $ref: '#/components/schemas/QuoteModelGET'
      security:
      - oauth2: []
    put:
      tags:
      - ResourceOwnerQuote
      summary: Updates a quote
      operationId: ResourceOwnerQuote_UpdateQuote
      parameters:
      - in: path
        name: quoteId
        description: Quote Id that needs to be udpated
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/HttpResponseMessage'
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResponseMessage'
            text/json:
              schema:
                $ref: '#/components/schemas/HttpResponseMessage'
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteModelPUT'
          text/json:
            schema:
              $ref: '#/components/schemas/QuoteModelPUT'
          application/*+json:
            schema:
              $ref: '#/components/schemas/QuoteModelPUT'
        description: Quote edit model
    delete:
      tags:
      - ResourceOwnerQuote
      summary: Soft deletes the Quote
      operationId: ResourceOwnerQuote_DeleteQuote
      parameters:
      - in: path
        name: quoteId
        description: Quote Id that needs to be deleted
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Success
      security:
      - oauth2: []
  /v1/resourceowner/quotes/{quoteId}/status:
    put:
      tags:
      - ResourceOwnerQuote
      summary: Update status of a quote
      operationId: ResourceOwnerQuote_UpdateStatus
      parameters:
      - in: path
        name: quoteId
        description: The quote which the satus should be updated on
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Successful update
        '403':
          description: Forbidden access to resource
        '500':
          description: Internal server error
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteStatusModelPUT'
          text/json:
            schema:
              $ref: '#/components/schemas/QuoteStatusModelPUT'
          application/*+json:
            schema:
              $ref: '#/components/schemas/QuoteStatusModelPUT'
        description: Quote status
  /v1/resourceowner/quotes/referenceId:
    get:
      tags:
      - ResourceOwnerQuote
      summary: Get a new reference id for a quote (not unique)
      operationId: ResourceOwnerQuote_GetNextQuoteId
      responses:
        '200':
          description: Successful request
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
        '500':
          description: Internal server error
      security:
      - oauth2: []
