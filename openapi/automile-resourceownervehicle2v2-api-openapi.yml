          format: int32
          enum:
          - 0
          - 1
          - 2
          - 4
          type: integer
          readOnly: true
      additionalProperties: false
    Vehicle2EditModel:
      type: object
      properties:
        NumberPlate:
          type: string
        Make:
          type: string
        Model:
          type: string
        ModelYear:
          format: int32
