          - 0
          - 1
          - 2
          type: integer
        CategoryColor:
          format: int32
          type: integer
        Heading:
          format: int32
          type: integer
      additionalProperties: false
    MoveDeviceRequest:
      type: object
      properties:
        FromVehicleId:
          format: int32
