        TripType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        AverageSpeedInKilometersPerHour:
          format: double
          type: number
        CustomCategory:
          type: string
        HideStartRoute:
          type: boolean
        HideEndRoute:
          type: boolean
        IsImperial:
          type: boolean
        UnitType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        TripApprovalStatus:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          type: integer
        RegisteredTollList:
          type: array
          items:
            $ref: '#/components/schemas/RegisteredTollModelGET'
        HasGermanTaxRules:
          type: boolean
          readOnly: true
        BusinessContact:
          type: string
          readOnly: true
        BusinessContactCompany:
          type: string
          readOnly: true
        TripReason:
          type: string
