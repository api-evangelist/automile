        OwnerCompanyId:
          format: int32
          type: integer
        UserVehicleIdentificationNumber:
          type: string
        FuelType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          type: integer
        DefaultTripType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          type: integer
        AllowAutomaticUpdates:
          type: boolean
        FrontTyre:
