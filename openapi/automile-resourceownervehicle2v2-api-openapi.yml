          type: number
        DefaultPrivacyPolicyType:
          format: int32
          enum:
          - 1
          type: integer
        UpdateFromTransportstyrelsen:
          type: boolean
        AllowSpeedRecording:
          type: boolean
        Nickname:
          type: string
        Tags:
          type: string
        CategoryColor:
          format: int32
          description: "Supported colors (hex value), \n3652794 (#37BCBA),\n2591227 (#2789FB),\n11430900 (#AE6BF4),\n16478657 (#FB71C1),\n16735053 (#FF5B4D),\n16752644 (#FFA004),\n16772393 (#FFED29),\n13228106 (#C9D84A),\n6597394 (#64AB12),\n12096370 (#B89372)"
          type: integer
        DeleteTripDetailsAfter:
          $ref: '#/components/schemas/TimeSpan'
        DeleteTripsAfter:
          $ref: '#/components/schemas/TimeSpan'
      additionalProperties: false
    TripConcatenationPoint:
      type: object
      properties:
        Latitude:
          format: double
          type: number
        Longitude:
          format: double
          type: number
        RecordTimeStamp:
          format: date-time
          type: string
        RecordTimeStampEpochMs:
          format: int64
          type: integer
          readOnly: true
        Speed:
          format: double
          type: number
        RPM:
          format: double
          type: number
        HeadingDegress:
          format: int32
