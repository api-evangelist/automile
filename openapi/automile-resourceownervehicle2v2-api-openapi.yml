        StartFormattedAddress:
          type: string
        EndFormattedAddress:
          type: string
        StartCustomAddress:
          type: string
        EndCustomAddress:
          type: string
        Distance:
          format: double
          type: number
        FuelConsumption:
          format: double
          type: number
        LengthInMinutes:
          format: int32
          type: integer
        DriverContactId:
          format: int32
          type: integer
        DriverName:
          type: string
        IdleRPMAverage:
          format: int32
          type: integer
        IdleTimeInSecondsForAllTrip:
          format: int32
          type: integer
        IdleTimeInSecondsFromStart:
          format: int32
          type: integer
        CO2Emission:
          format: double
          type: number
        MaxSpeed:
          format: double
          type: number
        MaxRPM:
          format: int32
          type: integer
        ParkedForMinutesUntilNextTrip:
          format: int32
          type: integer
        StartPoint:
          $ref: '#/components/schemas/TripConcatenationStartEndPoint'
        EndPoint:
          $ref: '#/components/schemas/TripConcatenationStartEndPoint'
        Notes:
