          type: integer
        LastTripId:
          format: int32
          type: integer
        MakeImageUrl:
          type: string
        CurrentOdometerInKilometers:
          format: double
          type: number
        UserVehicleIdentificationNumber:
          type: string
        FuelType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          type: integer
        DefaultTripType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          type: integer
        AllowAutomaticUpdates:
          type: boolean
        AquiredDate:
          format: date-time
          type: string
        YearlyTax:
          format: double
          type: number
        LastSyncUtcWithVehicleExternalInformation:
          format: date-time
          type: string
        NumberOfOwners:
          format: int32
          type: integer
        Status1:
          type: string
        RegisteredInISO3166CountryCode:
          type: string
        AllowAutomaticVehicleExternalInformationUpdate:
          type: boolean
        CO2Urban:
          format: double
          type: number
        CO2UrbanExtra:
          format: double
          type: number
        CO2Combined:
          format: double
          type: number
        FrontTyre:
          type: string
        RearTyre:
          type: string
        FrontWheelRim:
          type: string
        RearWheelRim:
          type: string
        TrailerHitch:
          type: boolean
        TrailerHitchMaxLoadKgWithoutBreaks:
          format: double
          type: number
        TrailerHitchMaxLoadKgWithDefaultDriversLicence:
          format: double
          type: number
        TrailerHitchMaxLoadKgWithAlternativeDriversLicence:
          format: double
          type: number
        InspectionPeriodStart:
          format: date-time
          type: string
        InspectionPeriodEnd:
          format: date-time
          type: string
        Owner:
          type: string
        OwnerType:
          format: int32
          enum:
          - 0
          - 1
          type: integer
        LeaseCompany:
          type: string
        InsuranceCompany:
