openapi: 3.2.0
info:
  title: Automile Resource Owner Contact3 API
  version: v1
tags:
- name: ResourceOwnerContact3
paths:
  /v1/resourceowner/contacts3:
    get:
      tags:
      - ResourceOwnerContact3
      summary: Get a list of all contacts that user is associated with
      description: Only companies that the user is associated with will be returned by this operation.
      operationId: GetResourceOwnerContacts3
      responses:
        '200':
          description: The contacts are returned
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact3Model'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact3Model'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contact3Model'
        '500':
          description: Internal server error
      security:
      - oauth2: []
    post:
      tags:
      - ResourceOwnerContact3
      summary: Creates a new contact
      operationId: CreateResourceOwnerContact3
      responses:
        '200':
          description: A link in the header is returned to the newly created contact
        '500':
          description: Internal server error
        '403':
          description: Request is forbidden, this could occur if you try to associate the contact you are not associated with
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact3CreateModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Contact3CreateModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Contact3CreateModel'
        description: The contact model
  /v1/resourceowner/contacts3/{contactId}:
    get:
      tags:
      - ResourceOwnerContact3
      summary: Get a contact by id
      description: The user only has access to companies that it is associated with
      operationId: GetResourceOwnerContact3
      parameters:
      - in: path
        name: contactId
        description: The contact id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The contact is returned
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Contact3DetailModel'
            application/json:
              schema:
                $ref: '#/components/schemas/Contact3DetailModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Contact3DetailModel'
        '403':
          description: Request is forbidden, meaning you dont' have access to this contact
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Contact does not exist
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
      security:
      - oauth2: []
    put:
      tags:
      - ResourceOwnerContact3
      summary: Updates the given contact id
      description: This will update the contact with the new model.
      operationId: EditResourceOwnerContact3
      parameters:
      - in: path
        name: contactId
        description: The contact that should be updated
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The contact was saved
        '403':
          description: Request is forbidden, this could occur if you are not associated with the contact
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: The contact that you tried to update doesn't exist
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact3EditModel'
          text/json:
            schema:
              $ref: '#/components/schemas/Contact3EditModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/Contact3EditModel'
        description: The new contact model
    delete:
      tags:
      - ResourceOwnerContact3
      summary: Removes the given contact
      operationId: DeleteResourceOwnerContact3
      parameters:
      - in: path
        name: contactId
        description: The company id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The contact has been deleted
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
        '400':
          description: Request is bad, You can't delete a contact that is bound to a user
        '404':
          description: The contact that you tried to remove doesn't exist
      security:
      - oauth2: []
  /v1/resourceowner/contacts3/me:
    get:
      tags:
      - ResourceOwnerContact3
      summary: Get the contact representing myself
      operationId: GetResourceOwnerContactMe3
      responses:
        '200':
          description: The contact is returned
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Contact3DetailModel'
            application/json:
              schema:
                $ref: '#/components/schemas/Contact3DetailModel'
            text/json:
              schema:
                $ref: '#/components/schemas/Contact3DetailModel'
        '403':
          description: Request is forbidden, meaning you dont' have access to this contact
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Contact does not exist
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/contacts3/me/image:
    get:
      tags:
      - ResourceOwnerContact3
      summary: Get contact profile image
      description: This will get the contact profile image, image data is returned in the response content
      operationId: GetImage3
      parameters:
      - in: query
        name: imageType
        description: enum ApiImageType
        schema:
          type: integer
          format: int32
          enum:
          - 0
          - 1
      responses:
        '200':
          description: Success
      security:
      - oauth2: []
  /v1/resourceowner/contacts3/me/uploadimage:
    post:
      tags:
      - ResourceOwnerContact3
      summary: Upload contact profile image
      description: This updates the contact profile image
      operationId: MeUploadImage3
      responses:
        '200':
          description: Profile image was saved
        '406':
          description: Request is not properly formatted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
      security:
      - oauth2: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
  /v1/resourceowner/contacts3/me/removeimage:
    put:
      tags:
      - ResourceOwnerContact3
      summary: Removes the users profile image
      description: This removes the contact profile image
      operationId: MeRemoveImage3
      responses:
        '200':
          description: The profile image has been deleted
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/contacts3/me/updatedefaultvehicle/{vehicleId}:
    put:
      tags:
      - ResourceOwnerContact3
      summary: Updates the default vehicle
      description: This will update the default vehicle
      operationId: MeUpdateDefaultVehicle3
      parameters:
      - in: path
        name: vehicleId
        description: The vehicle id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The default vehicle on contact was saved
        '403':
          description: Request is forbidden, this could occur if you are not associated with the contact
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/contacts3/updatedefaultvehicle/{vehicleId}:
    put:
      tags:
      - ResourceOwnerContact3
      summary: Updates the default vehicle
      description: This will update the default vehicle
      operationId: UpdateResourceOwnerContactDefaultVehicle3
      parameters:
      - in: path
        name: vehicleId
        description: The vehicle id
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: The default vehicle on contact was saved
        '403':
          description: Request is forbidden, this could occur if you are not associated with the contact
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/contacts3/customcategory:
    post:
      tags:
      - ResourceOwnerContact3
      summary: Add and remove custom categories
      operationId: ResourceOwnerContact3CustomCategory
      responses:
        '200':
          description: ''
        '500':
          description: Internal server error
      security:
      - oauth2: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomCategoryPostModel'
          text/json:
            schema:
              $ref: '#/components/schemas/CustomCategoryPostModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/CustomCategoryPostModel'
        description: The contact model
  /v1/resourceowner/contacts3/{contactId}/customcategories/{customCategoryId}:
    get:
      tags:
      - ResourceOwnerContact3
      summary: Get a custom category
      description: ''
      operationId: GetCustomCategoryResourceOwnerContacts3
      parameters:
      - in: path
        name: contactId
        required: true
        schema:
          type: integer
          format: int32
      - in: path
        name: customCategoryId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CustomCategoryModel'
            application/json:
              schema:
                $ref: '#/components/schemas/CustomCategoryModel'
            text/json:
              schema:
                $ref: '#/components/schemas/CustomCategoryModel'
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/contacts3/{contactId}/customcategories:
    get:
      tags:
      - ResourceOwnerContact3
      summary: Get a all custom categories
      description: ''
      operationId: GetCustomCategoriesResourceOwnerContacts3
      parameters:
      - in: path
        name: contactId
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: ''
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/CustomCategoryModel'
            application/json:
              schema:
                $ref: '#/components/schemas/CustomCategoryModel'
            text/json:
              schema:
                $ref: '#/components/schemas/CustomCategoryModel'
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/resourceowner/contacts3/getwebsocketauthenticationtoken:
    get:
      tags:
      - ResourceOwnerContact3
      summary: Get an encrypted token to be used for header authentication to Web Socket API.
      operationId: GetWebSocketAuthenticationToken
      responses:
        '200':
          description: ''
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ContactWebSocketAuthenticationTokenModel'
            application/json:
              schema:
                $ref: '#/components/schemas/ContactWebSocketAuthenticationTokenModel'
            text/json:
              schema:
                $ref: '#/components/schemas/ContactWebSocketAuthenticationTokenModel'
        '500':
          description: Internal server error
      security:
      - oauth2: []
components:
  schemas:
    TripScoreLevelModel:
      type: object
      properties:
        Color:
          type: string
        MinValue:
          format: int32
          type: integer
        Text:
          type: string
      additionalProperties: false
    AccountInformationModel:
      type: object
      properties:
        AccountOutstandingMessage:
          $ref: '#/components/schemas/AccountOutstandingMessageModel'
      additionalProperties: false
    SSOConfigurationModel:
      type: object
      properties:
        ClientId:
          type: string
        TenantId:
          type: string
        Scopes:
          type: array
          items:
            type: string
      additionalProperties: false
    TripScoreMessageModel:
      type: object
      properties:
        Title:
          type: string
        Message:
          type: string
      additionalProperties: false
    Contact3Model:
      type: object
      properties:
        ContactId:
          format: int32
          type: integer
        FirstName:
          type: string
        LastName:
          type: string
        EmailAddress:
          type: string
        MobilePhoneNumber:
          type: string
        ProfileImageUrl:
          type: string
        CheckedInDateTimeUtc:
          format: date-time
          type: string
        CheckedIntoVehicleId:
          format: int32
          type: integer
        IsManager:
          type: boolean
        CompanyRoles:
          type: array
          items:
            format: int32
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            type: integer
        CurrencyCode:
          description: ISO 4217 Currency code
          type: string
        LastCheckedInTripType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          type: integer
        CheckedInCustomTripTypeName:
          type: string
        OrganizationNodeId:
          format: int32
          type: integer
        OrganizationPermissions:
          $ref: '#/components/schemas/OrganizationPermissionBooleans'
        IsEditable:
          type: boolean
      additionalProperties: false
    Contact3CreateModel:
      required:
      - CreateRelationshipToCompanyId
      - FirstName
      - LastName
      type: object
      properties:
        FirstName:
          minLength: 1
          type: string
        LastName:
          minLength: 1
          type: string
        EmailAddress:
          type: string
        Description:
          type: string
        CreateRelationshipToCompanyId:
          format: int32
          type: integer
        CultureName:
          type: string
        CountryCodeIso1366:
          type: string
        DefaultVehicleId:
          format: int32
          type: integer
        UnitType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        SubscribeToNewsLetter:
          type: boolean
        MobilePhoneNumber:
          type: string
        MapType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        CurrencyCode:
          description: ISO 4217 Currency code
          type: string
        OrganizationNodeId:
          format: int32
          type: integer
        OrganizationPermissions:
          $ref: '#/components/schemas/OrganizationPermissionBooleans'
      additionalProperties: false
    AccountOutstandingMessageModel:
      type: object
      properties:
        Title:
          type: string
        Message:
          type: string
      additionalProperties: false
    CompanyScopesModel:
      type: object
      properties:
        CompanyId:
          format: int32
          type: integer
        VehicleIds:
          type: array
          items:
            format: int32
            type: integer
        Scopes:
          type: array
          items:
            type: string
      additionalProperties: false
    ContactMenuLayoutModel:
      type: object
      properties:
        MenuLayout:
          type: object
          additionalProperties:
            format: int64
            enum:
            - 0
            - 1
            - 2
            - 4
            type: integer
          readOnly: true
        ExpiresAtUtc:
          format: date-time
          description: UTC date time when menu layout cache was refreshed
          type: string
        RefreshedAtUtc:
          format: date-time
          description: UTC date time when menu layout cache was refreshed
          type: string
      additionalProperties: false
    ContactWebSocketAuthenticationTokenModel:
      type: object
      properties:
        ExpiresAtUtc:
          format: date-time
          type: string
        EncryptedToken:
          type: string
        UseHeaderForAuthentication:
          type: string
      additionalProperties: false
    HoursOfServiceSettingsModel:
      type: object
      properties:
        TimeZoneType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
          type: integer
        WorkDayStartTime:
          $ref: '#/components/schemas/TimeSpan'
        CycleRuleType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          type: integer
        CargoTypeType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        RestartRuleType:
          format: int32
          enum:
          - 0
          - 1
          type: integer
        RestBreakRuleType:
          format: int32
          enum:
          - 0
          - 1
          type: integer
        ShortHaulExceptionType:
          format: int32
          enum:
          - 0
          - 1
          type: integer
        OdometerUnitType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        WellSiteRuleType:
          format: int32
          enum:
          - 0
          - 1
          type: integer
        CarrierInfo:
          $ref: '#/components/schemas/AddressModel'
        IsEnabled:
          type: boolean
      additionalProperties: false
    AddressModel:
      required:
      - AddressLine2
      - City
      - ISO3166CountryCode
      - ZipCode
      type: object
      properties:
        AddressId:
          format: int32
          type: integer
        CompanyName:
          type: string
        ContactNameAtAddress:
          type: string
        AddressLine2:
          minLength: 1
          type: string
        AddressLine3:
          type: string
        AddressLine4:
          type: string
        ZipCode:
          minLength: 1
          type: string
        City:
          minLength: 1
          type: string
        StateOrProvince:
          type: string
        ISO3166CountryCode:
          minLength: 1
          type: string
      additionalProperties: false
    TripScoreInformationModel:
      type: object
      properties:
        CrownValue:
          format: int32
          type: integer
        EmptyMessage:
          $ref: '#/components/schemas/TripScoreMessageModel'
        HelpMessage:
          $ref: '#/components/schemas/TripScoreMessageModel'
        Levels:
          type: array
          items:
            $ref: '#/components/schemas/TripScoreLevelModel'
      additionalProperties: false
    OrganizationModel:
      type: object
      properties:
        OrganizationName:
          type: string
        LegalIdentificationNumber:
          type: string
        VATNumber:
          type: string
        BillingAddress:
          $ref: '#/components/schemas/AddressModel'
        ShipmentAddress:
          $ref: '#/components/schemas/AddressModel'
        Culture:
          type: string
        UnitType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        IsHierarchyEnabled:
          type: boolean
        ISO4217CurrencyCode:
          type: string
        OrganizationId:
          format: int32
          type: integer
      additionalProperties: false
    TimeSpan:
      type: object
      properties:
        Ticks:
          format: int64
          type: integer
        Days:
          format: int32
          type: integer
          readOnly: true
        Hours:
          format: int32
          type: integer
          readOnly: true
        Milliseconds:
          format: int32
          type: integer
          readOnly: true
        Microseconds:
          format: int32
          type: integer
          readOnly: true
        Nanoseconds:
          format: int32
          type: integer
          readOnly: true
        Minutes:
          format: int32
          type: integer
          readOnly: true
        Seconds:
          format: int32
          type: integer
          readOnly: true
        TotalDays:
          format: double
          type: number
          readOnly: true
        TotalHours:
          format: double
          type: number
          readOnly: true
        TotalMilliseconds:
          format: double
          type: number
          readOnly: true
        TotalMicroseconds:
          format: double
          type: number
          readOnly: true
        TotalNanoseconds:
          format: double
          type: number
          readOnly: true
        TotalMinutes:
          format: double
          type: number
          readOnly: true
        TotalSeconds:
          format: double
          type: number
          readOnly: true
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          format: int32
          type: integer
        detail:
          type: string
        instance:
          type: string
      additionalProperties: {}
    Contact3EditModel:
      type: object
      properties:
        FirstName:
          type: string
        LastName:
          type: string
        EmailAddress:
          type: string
        Description:
          type: string
        CultureName:
          type: string
        CountryCodeIso1366:
          type: string
        DefaultVehicleId:
          format: int32
          type: integer
        UnitType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        SubscribeToNewsLetter:
          type: boolean
        MobilePhoneNumber:
          type: string
        MapType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        CheckOutDateTimeUtc:
          format: date-time
          type: string
        CheckedInTripType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          type: integer
        CheckedInCustomTripTypeName:
          type: string
        CurrencyCode:
          description: ISO 4217 Currency code
          type: string
        OrganizationNodeId:
          format: int32
          type: integer
        OrganizationPermissions:
          $ref: '#/components/schemas/OrganizationPermissionBooleans'
      additionalProperties: false
    Contact3DetailModel:
      type: object
      properties:
        ContactId:
          format: int32
          type: integer
        FirstName:
          type: string
        LastName:
          type: string
        EmailAddress:
          type: string
        Description:
          type: string
        CultureName:
          type: string
        CountryCodeIso1366:
          type: string
        DefaultVehicleId:
          format: int32
          type: integer
        UnitType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        SubscribeToNewsLetter:
          type: boolean
        MobilePhoneNumber:
          type: string
        MapType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        CheckedIntoVehicleId:
          format: int32
          type: integer
        CheckedInDateTimeUtc:
          format: date-time
          type: string
        CheckOutDateTimeUtc:
          format: date-time
          type: string
        CheckedInTripType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          type: integer
        CheckedInCustomTripTypeName:
          type: string
        CompanyRoles:
          type: array
          items:
            format: int32
            enum:
            - 0
            - 1
            - 2
            - 3
            - 4
            - 5
            type: integer
        ProfileImageUrl:
          type: string
        OrganizationPermissions:
          $ref: '#/components/schemas/OrganizationPermissionBooleans'
        CurrencyCode:
          description: ISO 4217 Currency code
          type: string
        CompaniesScopes:
          type: array
          items:
            $ref: '#/components/schemas/CompanyScopesModel'
        IsLocked:
          type: boolean
        CustomCategories:
          type: array
          items:
            $ref: '#/components/schemas/CustomCategoryModel'
        OrganizationNodeId:
          format: int32
