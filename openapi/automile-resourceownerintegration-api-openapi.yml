  AutoPlanV2InformationModel:
    type: object
    properties:
      VehicleList:
        type: array
        items:
          $ref: '#/definitions/AutoPlanV2VehicleInfo'
    additionalProperties: false
  AutoplanMileageLogModel:
    type: object
    properties:
      StartOdometerKm:
        format: int32
        type: integer
      EndOdometerKm:
        format: int32
        type: integer
      BusinessKm:
        format: int32
        type: integer
      IsApproved:
        type: boolean
      TotalKm:
        format: int32
        type: integer
        readOnly: true
      OtherAndPrivateKm:
        format: int32
        type: integer
        readOnly: true
    additionalProperties: false
  AutoPlanV2DrivingJournalModel:
    type: object
    properties:
      StartOdometerKm:
        format: int32
        type: integer
      EndOdometerKm:
        format: int32
        type: integer
      BusinessKm:
        format: int32
        type: integer
      IsApproved:
        type: boolean
    additionalProperties: false
  Version:
    type: object
    properties:
      Major:
        format: int32
        type: integer
        readOnly: true
      Minor:
        format: int32
        type: integer
        readOnly: true
      Build:
        format: int32
        type: integer
        readOnly: true
      Revision:
        format: int32
        type: integer
        readOnly: true
      MajorRevision:
        format: int32
        type: integer
        readOnly: true
      MinorRevision:
        format: int32
        type: integer
        readOnly: true
    additionalProperties: false
securityDefinitions:
  oauth2:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.automile.com/login/
    scopes:
      read: Read access to protected resources
      write: Write access to protected resources
    description: OAuth2 Implicit Grant
