openapi: 3.2.0
info:
  title: Automile Client Contracts API
  version: v1
tags:
- name: ClientContracts
paths:
  /v1/client/contracts:
    get:
      tags:
      - ClientContracts
      summary: Get client contracts
      responses:
        '200':
          description: ''
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/HttpResponseMessage'
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResponseMessage'
            text/json:
              schema:
                $ref: '#/components/schemas/HttpResponseMessage'
        '500':
          description: Internal server error
      security:
      - oauth2: []
      x-summary-source: derived
      operationId: getV1ClientContracts
      x-operation-id-source: derived
  /v1/client/contracts/journeys:
    get:
      tags:
      - ClientContracts
      summary: Get client contracts journeys
      parameters:
      - in: query
        name: contractId
        schema:
          type: integer
          format: int32
      - in: query
        name: fromDate
        schema:
          type: string
          format: date-time
      - in: query
        name: toDate
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: ''
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/HttpResponseMessage'
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResponseMessage'
            text/json:
              schema:
                $ref: '#/components/schemas/HttpResponseMessage'
        '500':
          description: Internal server error
      security:
      - oauth2: []
      x-summary-source: derived
      operationId: getV1ClientContractsJourneys
      x-operation-id-source: derived
  /v1/client/contracts/confirmjourneys:
    post:
      tags:
      - ClientContracts
      summary: Create client contracts confirmjourneys
      parameters:
      - in: query
        name: ids
        style: form
        explode: true
        schema:
          type: array
          items:
            format: int32
            type: integer
      responses:
        '200':
          description: ''
        '500':
          description: Internal server error
      security:
      - oauth2: []
      x-summary-source: derived
      operationId: postV1ClientContractsConfirmjourneys
      x-operation-id-source: derived
