swagger: '2.0'
info:
  title: Automile ClientApi ClientContracts API
  version: v1
tags:
- name: ClientContracts
paths:
  /v1/client/contracts:
    get:
      tags:
      - ClientContracts
      summary: ''
      produces:
      - text/plain
      - application/json
      - text/json
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/HttpResponseMessage'
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/client/contracts/journeys:
    get:
      tags:
      - ClientContracts
      summary: ''
      produces:
      - text/plain
      - application/json
      - text/json
      parameters:
      - in: query
        name: contractId
        type: integer
        format: int32
      - in: query
        name: fromDate
        type: string
        format: date-time
      - in: query
        name: toDate
        type: string
        format: date-time
      responses:
        '200':
          description: ''
          schema:
            $ref: '#/definitions/HttpResponseMessage'
        '500':
          description: Internal server error
      security:
      - oauth2: []
  /v1/client/contracts/confirmjourneys:
    post:
      tags:
      - ClientContracts
      summary: ''
      parameters:
      - in: query
        name: ids
        type: array
        items:
          format: int32
          type: integer
        collectionFormat: multi
      responses:
        '200':
          description: ''
        '500':
          description: Internal server error
      security:
      - oauth2: []
