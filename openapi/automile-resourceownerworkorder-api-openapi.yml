        AttachmentType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
      additionalProperties: false
    WorkOrderModelPOST:
      type: object
      properties:
        JobDate:
          format: date-time
          type: string
        JobTime:
          $ref: '#/components/schemas/TimeSpan'
        EstimatedTimeInMinutes:
          format: int32
          type: integer
        JobDescription:
          type: string
        ExternalId:
          type: string
        CustomerContactName:
          type: string
        CustomerEmail:
          type: string
        CustomerName:
          type: string
        CustomerCommunicationLanguageISO639_2:
          type: string
        CustomerPhoneNumber:
          type: string
        CustomerJobAddress:
          $ref: '#/components/schemas/CustomerJobAddressModel'
        CustomerBillingAddress:
          $ref: '#/components/schemas/CustomerBillingAddressModel'
        NotificationType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          type: integer
        WorkOrderCategoryId:
          format: int32
          type: integer
        CategoryName:
          type: string
        AssignedToContactId:
          format: int32
          type: integer
        QuoteId:
          format: int32
          type: integer
        WorkOrderCustomerId:
          format: int32
          type: integer
        Status:
          format: int32
          enum:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          type: integer
        Notes:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderNoteModelPOST'
        Items:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderItemModelPOST'
        Attachments:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderAttachmentModelPOST'
      additionalProperties: false
    WorkOrderAttachmentModelGET:
      required:
      - AttachmentType
      - URL
      type: object
      properties:
        URL:
          minLength: 1
          type: string
        Description:
          type: string
        AttachmentType:
          format: int32
          enum:
          - 0
          - 1
          - 2
          type: integer
        WorkOrderAttachmentId:
          format: int32
          type: integer
        CreatedByContactId:
          format: int32
          type: integer
        Created:
          format: date-time
          type: string
      additionalProperties: false
    WorkOrderItemModelPOST:
