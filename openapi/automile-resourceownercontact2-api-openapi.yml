  CustomCategoryCreateModel:
    type: object
    properties:
      Value:
        type: string
      CustomCategoryType:
        format: int32
        enum:
        - 0
        - 1
        type: integer
    additionalProperties: false
  CustomCategoryModel:
    type: object
    properties:
      CustomCategoryId:
        format: int32
        type: integer
      Value:
        type: string
      CustomCategoryType:
        format: int32
        enum:
        - 0
        - 1
        type: integer
    additionalProperties: false
securityDefinitions:
  oauth2:
    type: oauth2
    flow: implicit
    authorizationUrl: https://api.automile.com/login/
    scopes:
      read: Read access to protected resources
      write: Write access to protected resources
    description: OAuth2 Implicit Grant
