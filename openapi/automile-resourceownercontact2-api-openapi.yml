        type: integer
      UnitType:
        format: int32
        enum:
        - 0
        - 1
        - 2
        type: integer
      SubscribeToNewsLetter:
        type: boolean
      MobilePhoneNumber:
        type: string
      MapType:
        format: int32
        enum:
        - 0
        - 1
        - 2
        type: integer
      CheckOutDateTimeUtc:
        format: date-time
        type: string
      CheckedInTripType:
        format: int32
        enum:
        - 0
        - 1
        - 2
        - 3
        type: integer
      CheckedInCustomTripTypeName:
        type: string
      CurrencyCode:
        description: ISO 4217 Currency code
        type: string
    additionalProperties: false
  ContactMenuLayoutModel:
    type: object
    properties:
      MenuLayout:
        type: object
        additionalProperties:
          format: int64
          enum:
          - 0
          - 1
          - 2
          - 4
          type: integer
        readOnly: true
      ExpiresAtUtc:
        format: date-time
        description: UTC date time when menu layout cache was refreshed
        type: string
      RefreshedAtUtc:
        format: date-time
        description: UTC date time when menu layout cache was refreshed
        type: string
    additionalProperties: false
  ProblemDetails:
    type: object
    properties:
      type:
        type: string
      title:
        type: string
      status:
        format: int32
        type: integer
      detail:
        type: string
      instance:
        type: string
    additionalProperties: {}
  Contact2CreateModel:
    required:
    - CreateRelationshipToCompanyId
    - FirstName
    - LastName
    type: object
    properties:
      FirstName:
        minLength: 1
        type: string
      LastName:
        minLength: 1
        type: string
      EmailAddress:
        type: string
      Description:
        type: string
      CreateRelationshipToCompanyId:
        format: int32
        type: integer
      CultureName:
        type: string
      CountryCodeIso1366:
