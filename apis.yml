aid: automile
name: Automile
description: >-
  Automile is a fleet-telematics platform used by more than 15,000 businesses to
  track and manage their vehicles. Its plug-and-play "Automile Box" streams GPS
  position every fifteen seconds while web and mobile apps handle automatic
  mileage logging, trips, drivers, geofences, expense reports, vehicle
  inspections, work orders and OBD vehicle-health. The developer surface is a
  REST/JSON API at api.automile.com (Swagger 2.0, OAuth2) with 454 operations and
  a publish/subscribe webhook stream for trip, vehicle, contact and device
  events, plus first-party SDKs for PHP, .NET, Node and Java. Automile was added
  to the API Evangelist network as an insight-partners / point-nine portfolio
  lead and enriched from its live public developer surface.
